# Sealed Secrets first: every later app's credentials are SealedSecrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ml-platform
  source:
    repoURL: https://github.com/Kanim21/ml-training-platform.git
    targetRevision: main
    path: gitops/platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false   # pruning the controller would orphan the sealing key
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
