apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ml-platform
  source:
    repoURL: https://github.com/Kanim21/ml-training-platform.git
    targetRevision: main
    path: gitops/platform/cnpg-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: false   # pruning CRDs would delete every Postgres cluster
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # CRDs exceed the client-side annotation limit
