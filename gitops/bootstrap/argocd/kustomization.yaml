# ArgoCD itself. Applied once by `make bootstrap` (the only direct kubectl
# apply in this repo); after that the `argocd` Application in ../apps
# manages it from Git, so upgrades are a commit that bumps the version below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
# Dex (SSO) and notifications are unused in this lab (admin login, no
# alerting from ArgoCD); scaling them to zero frees memory on the small node.
patches:
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
