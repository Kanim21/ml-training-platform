---
- name: Harden Rocky Linux nodes
  hosts: k3s_cluster
  roles:
    - rocky_base

- name: Install K3s server
  hosts: k3s_server
  roles:
    - k3s_server

- name: Join K3s agents
  hosts: k3s_agents
  roles:
    - k3s_agent

- name: Fetch admin kubeconfig to the control machine
  hosts: k3s_server
  roles:
    - kubeconfig
