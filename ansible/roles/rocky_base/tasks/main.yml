---
- name: Assert the target is Rocky Linux 9 or 10
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Rocky'
      - ansible_facts['distribution_major_version'] | int >= 9
    fail_msg: "rocky_base supports Rocky Linux 9/10, got {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Assert SELinux is enforcing (it stays on; K3s uses k3s-selinux)
  ansible.builtin.assert:
    that:
      - ansible_facts['selinux']['status'] == 'enabled'
      - ansible_facts['selinux']['mode'] == 'enforcing'
    fail_msg: "SELinux must be enforcing. Fix the VM image rather than disabling it."

- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ rocky_base_packages }}"
    state: present

# The stock "makestep 1.0 3" only steps the clock in the first three updates.
# A VM resumed after host sleep can be minutes behind, and slewing that back
# takes hours of TLS and lease errors, so always step when off by over 1s.
- name: Let chrony step the clock after VM suspend/resume
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^makestep\s'
    line: makestep 1 -1
  notify: Restart chronyd

- name: Enable chronyd (etcd/kine and TLS need sane clocks)
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Disable swap at boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules needed by flannel and kube-proxy
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - br_netfilter
    - overlay

- name: Set kernel networking sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.ipv4.ip_forward: "1"
      net.bridge.bridge-nf-call-iptables: "1"
      net.bridge.bridge-nf-call-ip6tables: "1"

- name: Harden sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/50-hardening.conf
    regexp: "^{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
    create: true
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  loop: "{{ rocky_base_sshd_settings | dict2items }}"
  notify: Restart sshd

- name: Configure dnf-automatic for security updates only
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: upgrade_type, value: security }
    - { key: apply_updates, value: "yes" }
  when: rocky_base_auto_security_updates

- name: Enable dnf-automatic timer
  ansible.builtin.service:
    name: dnf-automatic.timer
    state: started
    enabled: true
  when: rocky_base_auto_security_updates

- name: Enable firewalld (stays on; K3s ports are opened explicitly)
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Trust pod and service CIDRs (per K3s docs for firewalld)
  ansible.posix.firewalld:
    zone: trusted
    source: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - "{{ k3s_cluster_cidr }}"
    - "{{ k3s_service_cidr }}"
  notify: Reload firewalld

- name: Open node-to-node K3s ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - 10250/tcp   # kubelet metrics / logs / exec
    - 8472/udp    # flannel VXLAN
  notify: Reload firewalld

- name: Open the API server port on servers
  ansible.posix.firewalld:
    port: "{{ k3s_api_port }}/tcp"
    permanent: true
    state: enabled
  when: inventory_hostname in groups['k3s_server']
  notify: Reload firewalld

- name: Apply firewall changes before K3s starts
  ansible.builtin.meta: flush_handlers
